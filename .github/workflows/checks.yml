name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Preinstalled on the runner image.
      - run: shellcheck claude-bgwatch tests/run.sh

  tests:
    # macOS for the bash 3.2 and BSD tools it ships, which is where the script
    # is used most and where a bash-4 habit breaks it. Ubuntu for GNU ps, stat
    # and lsof, which differ in the flags that matter here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes seconds. Without a limit, a follow that never ends holds
    # the PR for GitHub's default of six hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq jq lsof
      - name: bash version
        run: /usr/bin/env bash --version | head -1
      - run: tests/run.sh

  # A version constant maintained by hand drifts, because bumping it is a step
  # that gets forgotten. This runs only when a tag is pushed and fails the tag
  # if the script would report a version it is not.
  version-matches-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Script version must match the tag
        # GITHUB_REF_NAME rather than an expression, so the tag arrives as data
        # instead of being pasted into the script before it runs.
        run: |
          expected=${GITHUB_REF_NAME#v}
          actual=$(sed -n "s/^VERSION='\(.*\)'$/\1/p" claude-bgwatch)
          echo "tag: $GITHUB_REF_NAME   expects: $expected   claude-bgwatch says: ${actual:-nothing}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::VERSION is '$actual' but the tag is '$GITHUB_REF_NAME' - bump it before tagging"
            exit 1
          fi

  # Attaches the script and its checksum to the tag's release. Pushing a tag
  # does not create a release, and `gh release upload` on a tag with none
  # fails, so a draft is created when there is none yet. It stays a draft:
  # the notes are written, and it is published, by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, tests, version-matches-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          sha256sum claude-bgwatch > claude-bgwatch.sha256
          cat claude-bgwatch.sha256 >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "No release for $tag yet - creating a draft to attach to."
            gh release create "$tag" --draft --verify-tag --title "claude-bgwatch ${tag#v}" \
              --notes "Draft - release notes not written yet."
          fi
          gh release upload "$tag" claude-bgwatch claude-bgwatch.sha256 --clobber
